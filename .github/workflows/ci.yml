name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    lint-and-hygiene:
        name: Lint & Repository Hygiene
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Verify Git Hooks and Executable Permissions
              run: |
                  chmod +x .githooks/* tools/cpt tools/cptool
                  ls -la .githooks/
                  test -x .githooks/pre-commit
                  test -x .githooks/commit-msg
                  test -x .githooks/pre-push

            - name: Run make lint
              run: make lint

    build-and-test:
        name: Build & Algorithm Tests (C++23 & CLI)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Modern GCC (C++23)
              run: |
                  export DEBIAN_FRONTEND=noninteractive
                  if ! command -v g++-13 >/dev/null 2>&1 && ! command -v g++-14 >/dev/null 2>&1; then
                    sudo apt-get update -qq
                    sudo apt-get install -y -qq g++-13
                  fi
                  if command -v g++-14 >/dev/null 2>&1; then
                    sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
                  elif command -v g++-13 >/dev/null 2>&1; then
                    sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
                  fi
                  g++ --version

            - name: Run Test Suite
              run: make test

    stats-verification:
        name: Verify Repository Statistics
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Run make stats
              run: make stats
