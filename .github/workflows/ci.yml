name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-hygiene:
    name: Lint & Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Git Hooks and Executable Permissions
        run: |
          chmod +x .githooks/* tools/cpt tools/cptool
          ls -la .githooks/
          test -x .githooks/pre-commit
          test -x .githooks/commit-msg
          test -x .githooks/pre-push

      - name: Run make lint
        run: make lint

  build-and-test:
    name: Build & Algorithm Tests (C++23 & CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Modern GCC (C++23)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          g++ --version

      - name: Run Test Suite
        run: make test

  stats-verification:
    name: Verify Repository Statistics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run make stats
        run: make stats
